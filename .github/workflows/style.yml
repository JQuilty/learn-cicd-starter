name: Style

on:
  pull_request:
    branches: [main]

jobs:
  tests:
  name: StyleTests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"

      - name: Go Testing
        run: test -z $(go fmt ./...)

